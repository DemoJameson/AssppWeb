services:
  asspp:
    image: ghcr.io/demojameson/assppweb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mnt/asspp-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8080
      # Public origin(s) install links are built from. List every hostname this
      # deployment answers on, most preferred first, so each one links to itself.
      # - PUBLIC_BASE_URL=https://asspp.example.com,https://asspp-v6.example.net
      # - DOWNLOAD_THREADS=8
      # - ACCESS_PASSWORD=your_password_here
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "5"
